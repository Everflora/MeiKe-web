<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="/MeiKe-web/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f1">
  <meta name="description" content="梅课 · SEU 校园课表。保存整周课程、查看今日安排和学校校历，支持离线使用。">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="梅课">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="pwa.css">
  <title>梅课 · MeiKe</title>
</head>
<body>
  <div id="loading" role="status">
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <h1>梅课</h1><p id="loading-message">正在打开你的课表…</p>
    <p class="hint">首次打开需要下载中文字体和离线资源，请保持联网。</p>
    <button id="retry" hidden>重新打开</button>
    <a href="privacy.html">使用与隐私说明</a>
  </div>
  <div id="pwa-notice" role="status" aria-live="polite" hidden>
    <span id="pwa-message"></span>
    <button id="pwa-update" hidden>保存编辑后更新</button>
    <button id="pwa-dismiss" aria-label="关闭提示">×</button>
  </div>
  <noscript>梅课需要启用 JavaScript。请在 Safari 或 Chrome 中打开此页面。</noscript>
  <script src="pwa.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
